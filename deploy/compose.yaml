# Process redundancy on one host. Host/region HA requires the existing provider.
x-api: &api
  build: ../backend
  env_file: .env.production
  environment:
    NODE_ENV: production
    PORT: 5000
    TRUST_PROXY_HOPS: 1
  restart: unless-stopped
  stop_grace_period: 30s
  expose: ["5000"]
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
services:
  api_a: *api
  api_b: *api
  web:
    build:
      context: ../frontend_web
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    expose: ["8080"]
  gateway:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your real domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api_a, api_b, web]
volumes:
  caddy_data:
  caddy_config:
