name: smart_sports_hub
description: A new Flutter project for Smart Sports Hub.
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.3.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  go_router: ^10.1.2
  qr_flutter: ^4.1.0
  intl: ^0.18.1
  shared_preferences: ^2.5.5
  google_fonts: ^6.1.0
  socket_io_client: ^2.0.3-beta.0
  tutorial_coach_mark: ^1.3.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.2
  mobile_scanner: 7.4.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_maps_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo.jpg
    - assets/clubhouse/
